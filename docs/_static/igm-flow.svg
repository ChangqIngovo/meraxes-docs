<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 625" role="img" aria-labelledby="title desc">
<title id="title">IGM and 21-cm calculation</title><desc id="desc">Prepared source and density grids undergo an optional thermal step and ionization before brightness and separately enabled derived products.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203344} .heading{font-weight:700;font-size:17px} .body{font-size:14px} .label{font-size:13px}</style>
<rect width="1120" height="625" fill="white"/>
<rect x="35" y="25" width="280" height="95" rx="8" fill="#EFF8F5" stroke="#278470" stroke-width="1.6"/>
<text x="175.0" y="50" text-anchor="middle" class="heading">Prepared grids</text>
<text x="175.0" y="73" text-anchor="middle" class="body">Galaxy radiation sources</text>
<text x="175.0" y="92" text-anchor="middle" class="body">Simulation density contrast</text>
<rect x="410" y="25" width="300" height="110" rx="8" fill="#EFF8F5" stroke="#278470" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="560.0" y="50" text-anchor="middle" class="heading">Thermal evolution</text>
<text x="560.0" y="73" text-anchor="middle" class="body">ComputeTs() when enabled</text>
<text x="560.0" y="92" text-anchor="middle" class="body">T_K; x_e; Lyα coupling; T_S</text>
<rect x="805" y="25" width="280" height="110" rx="8" fill="#EFF8F5" stroke="#278470" stroke-width="1.6"/>
<text x="945.0" y="50" text-anchor="middle" class="heading">Ionization</text>
<text x="945.0" y="73" text-anchor="middle" class="body">find_HII_bubbles()</text>
<text x="945.0" y="92" text-anchor="middle" class="body">xH; recombination history</text>
<text x="945.0" y="111" text-anchor="middle" class="body">Persistent UVB fields</text>
<rect x="805" y="250" width="280" height="110" rx="8" fill="#EFF8F5" stroke="#278470" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="945.0" y="275" text-anchor="middle" class="heading">21-cm brightness</text>
<text x="945.0" y="298" text-anchor="middle" class="body">ComputeBrightnessTemperatureBox()</text>
<text x="945.0" y="317" text-anchor="middle" class="body">delta_T</text>
<text x="945.0" y="336" text-anchor="middle" class="body">When enabled</text>
<rect x="410" y="450" width="300" height="100" rx="8" fill="#FCF2F4" stroke="#BD5864" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="560.0" y="475" text-anchor="middle" class="heading">Power spectrum</text>
<text x="560.0" y="498" text-anchor="middle" class="body">Compute_PS()</text>
<text x="560.0" y="517" text-anchor="middle" class="body">k_bins; PS_data; PS_error</text>
<rect x="805" y="450" width="280" height="100" rx="8" fill="#FCF2F4" stroke="#BD5864" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="945.0" y="475" text-anchor="middle" class="heading">Lightcone</text>
<text x="945.0" y="498" text-anchor="middle" class="body">ConstructLightcone()</text>
<text x="945.0" y="517" text-anchor="middle" class="body">LightconeBox; lightcone-z</text>
<path d="M 315 72.5 L 410 80" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 710 80 L 805 80" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 175 120 L 175 185 L 770 185 L 770 0 L 945 0 L 945 25" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<text x="455" y="176" text-anchor="middle" class="label">Thermal step disabled</text>
<path d="M 945 135 L 945 250" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 945 360 L 945 400 L 560 400 L 560 450" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 945 360 L 945 450" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="735" y="604" text-anchor="middle" class="label">Power spectrum and lightcone consume the same brightness field; enabled independently.</text>
