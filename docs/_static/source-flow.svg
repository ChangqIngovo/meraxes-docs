<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 675" role="img" aria-labelledby="title desc">
<title id="title">From galaxies to radiation grids</title><desc id="desc">Galaxy source quantities and simulation density enter separate readers before grid calculations produce ionization, thermal and 21-cm products.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203344} .heading{font-weight:700;font-size:17px} .body{font-size:14px} .label{font-size:13px}</style>
<rect width="1220" height="675" fill="white"/>
<rect x="25" y="20" width="350" height="105" rx="8" fill="#FCF6EB" stroke="#BA7D25" stroke-width="1.6"/>
<text x="200.0" y="45" text-anchor="middle" class="heading">Galaxy source state</text>
<text x="200.0" y="68" text-anchor="middle" class="body">Stars, SFR and effective AGN sources</text>
<text x="200.0" y="87" text-anchor="middle" class="body">Standard or enabled stochastic treatment</text>
<text x="200.0" y="106" text-anchor="middle" class="body">Source quantities after galaxy evolution</text>
<rect x="440" y="20" width="320" height="105" rx="8" fill="#EFF8F5" stroke="#278470" stroke-width="1.6"/>
<text x="600.0" y="45" text-anchor="middle" class="heading">Deposit on the spatial grid</text>
<text x="600.0" y="68" text-anchor="middle" class="body">construct_baryon_grids()</text>
<text x="600.0" y="87" text-anchor="middle" class="body">Nearest-grid-point cell sums</text>
<text x="600.0" y="106" text-anchor="middle" class="body">MPI assembly</text>
<rect x="835" y="20" width="320" height="125" rx="8" fill="#EFF8F5" stroke="#278470" stroke-width="1.6"/>
<text x="995.0" y="45" text-anchor="middle" class="heading">Source arrays</text>
<text x="995.0" y="68" text-anchor="middle" class="body">stars; weighted_sfr; sfr; Pop III</text>
<text x="995.0" y="87" text-anchor="middle" class="body">effective_bhm; effective_bhar</text>
<text x="995.0" y="106" text-anchor="middle" class="body">Internal X-ray heating sources</text>
<text x="995.0" y="125" text-anchor="middle" class="body">Saved arrays listed in Outputs</text>
<rect x="25" y="245" width="350" height="100" rx="8" fill="#F1F6FC" stroke="#427CC0" stroke-width="1.6"/>
<text x="200.0" y="270" text-anchor="middle" class="heading">Simulation input</text>
<text x="200.0" y="293" text-anchor="middle" class="body">Density contrast</text>
<text x="200.0" y="312" text-anchor="middle" class="body">Velocity in the thermal path</text>
<text x="200.0" y="331" text-anchor="middle" class="body">Independent of galaxy deposition</text>
<rect x="440" y="230" width="320" height="125" rx="8" fill="#EFF8F5" stroke="#278470" stroke-width="1.6"/>
<text x="600.0" y="255" text-anchor="middle" class="heading">Calculate IGM fields</text>
<text x="600.0" y="278" text-anchor="middle" class="body">Thermal evolution when enabled</text>
<text x="600.0" y="297" text-anchor="middle" class="body">Ionization and recombinations</text>
<text x="600.0" y="316" text-anchor="middle" class="body">Persistent photoheating history</text>
<text x="600.0" y="335" text-anchor="middle" class="body">Density and radiation sources</text>
<rect x="835" y="245" width="320" height="100" rx="8" fill="#EFF8F5" stroke="#278470" stroke-width="1.6"/>
<text x="995.0" y="270" text-anchor="middle" class="heading">21-cm signal</text>
<text x="995.0" y="293" text-anchor="middle" class="body">Co-eval brightness temperature</text>
<text x="995.0" y="312" text-anchor="middle" class="body">Optional power spectrum and lightcone</text>
<rect x="440" y="465" width="320" height="100" rx="8" fill="#F6F1FA" stroke="#8260A2" stroke-width="1.6"/>
<text x="600.0" y="490" text-anchor="middle" class="heading">Feedback to galaxies</text>
<text x="600.0" y="513" text-anchor="middle" class="body">Local UVB history → MvirCrit</text>
<text x="600.0" y="532" text-anchor="middle" class="body">Suppress subsequent baryonic infall</text>
<rect x="835" y="465" width="320" height="100" rx="8" fill="#FCF2F4" stroke="#BD5864" stroke-width="1.6"/>
<text x="995.0" y="490" text-anchor="middle" class="heading">Saved products</text>
<text x="995.0" y="513" text-anchor="middle" class="body">Rank catalogues and grid files</text>
<text x="995.0" y="532" text-anchor="middle" class="body">Linked through the master file</text>
<path d="M 375 72.5 L 440 72.5" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 760 72.5 L 835 82.5" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 995 145 L 995 185 L 600 185 L 600 230" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 375 295 L 440 292.5" fill="none" stroke="#427CC0" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 760 292.5 L 835 295" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 600 355 L 600 465" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 440 515 L 10 515 L 10 72.5 L 25 72.5" fill="none" stroke="#8260A2" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 4"/>
<path d="M 995 345 L 995 465" fill="none" stroke="#536676" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="590" y="625" text-anchor="middle" class="label">Source arrays are spatial inputs; galaxy catalogue fields remain separate saved records.</text>
</svg>